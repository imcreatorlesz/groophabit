<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Привычка — дневник с обществом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
  :root{
    --ink:#20281F; --paper:#F1ECDC; --paper-2:#E7E0CB;
    --moss:#455B41; --moss-dark:#33452F; --ember:#B75B2E;
    --line:#CFC5A6; --card:#FAF7EC; --muted:#6E6A57;
  }
  *{box-sizing:border-box;}
  html, body{overflow-x:hidden;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Work Sans',sans-serif; line-height:1.5;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:500; margin:0;}
  .wrap{max-width:720px; margin:0 auto; padding:0 24px;}
  header{padding:22px 0; border-bottom:1px solid var(--line);}
  header .wrap{display:flex; align-items:center; justify-content:space-between;}
  .logo{font-family:'Fraunces',serif; font-size:1.3rem; display:flex; align-items:center; gap:8px;}
  .logo-mark{width:12px; height:12px; border-radius:50%; background:var(--ember); display:inline-block;}
  #userBadge{font-size:0.85rem; color:var(--muted);}
  #userBadge button{margin-left:12px; background:none; border:none; text-decoration:underline; cursor:pointer; color:var(--muted); font-family:inherit;}

  main{padding:48px 0;}

  /* auth form */
  .authbox{
    max-width:400px; margin:60px auto; background:var(--card);
    border:1px solid var(--line); padding:32px;
  }
  .authbox h2{font-size:1.5rem; margin-bottom:6px;}
  .authbox p.sub{color:var(--muted); font-size:0.9rem; margin:0 0 22px;}
  .authbox label{font-size:0.85rem; color:var(--muted); display:block; margin-bottom:6px;}
  .authbox input{
    width:100%; font-family:inherit; font-size:0.95rem; padding:10px 12px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    border-radius:2px; margin-bottom:16px;
  }
  .authbox input:focus{outline:2px solid var(--moss); outline-offset:1px;}
  .btn{
    font-family:'Work Sans',sans-serif; font-size:0.95rem; font-weight:600;
    padding:12px 22px; border-radius:3px; border:1px solid var(--moss);
    background:var(--moss); color:var(--paper); cursor:pointer; width:100%;
  }
  .btn:hover{background:var(--moss-dark);}
  .switch{margin-top:16px; font-size:0.85rem; color:var(--muted); text-align:center;}
  .switch button{background:none; border:none; color:var(--ember); text-decoration:underline; cursor:pointer; font-family:inherit; font-size:inherit;}
  .authmsg{font-size:0.85rem; margin-top:10px; min-height:1.2em;}
  .authmsg.err{color:var(--ember);}
  .authmsg.ok{color:var(--moss);}

  /* app (same structure as demo version) */
  .today-card{padding:24px; background:var(--card); border:1px solid var(--line);}
  .today-card .row{display:flex; align-items:center; justify-content:space-between; gap:14px;}
  .emoji{font-size:1.8rem;}
  .name{font-size:1.05rem; font-weight:600;}
  .checkbtn{
    font-family:inherit; font-weight:600; font-size:0.9rem; padding:11px 18px;
    border-radius:3px; border:1px solid var(--moss); background:transparent; color:var(--moss); cursor:pointer;
  }
  .checkbtn.done{background:var(--moss); color:var(--paper);}
  .streakrow{display:flex; gap:26px; margin-top:18px;}
  .stat .num{font-family:'Fraunces',serif; font-size:1.8rem;}
  .stat .lab{font-size:0.82rem; color:var(--muted);}

  .setup-row{display:flex; gap:10px; margin-bottom:20px;}
  .setup-row select, .setup-row input{
    font-family:inherit; font-size:0.9rem; padding:9px 10px; border:1px solid var(--line);
    background:var(--paper); border-radius:2px;
  }
  .setup-row input{flex:1;}

  .group-card{margin-top:30px; padding:24px; background:var(--card); border:1px solid var(--line);}
  .group-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
  .member{display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line);}
  .member:first-of-type{border-top:none;}
  .avatar{width:34px; height:34px; border-radius:50%; background:var(--moss); color:var(--paper);
    display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:600; flex-shrink:0;}
  .member.you .avatar{background:var(--ember);}
  .member-info{flex:1; min-width:0;}
  .member-info .mname{font-size:0.9rem; font-weight:600;}
  .member-status{width:20px; height:20px; border-radius:50%; border:1px solid var(--line); flex-shrink:0;}
  .member-status.done{background:var(--moss); border-color:var(--moss);}
  .joingroup{margin-top:14px; display:flex; gap:8px;}
  .joingroup input{flex:1; font-family:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:2px;}
  .joingroup button{font-family:inherit; padding:9px 14px; border:1px solid var(--moss); background:transparent; color:var(--moss); border-radius:2px; cursor:pointer;}
  .joingroup{flex-wrap:wrap;}
.joingroup input{min-width:0;}
.joingroup button{flex-shrink:0;}
  .chatmsg{margin-bottom:10px; font-size:0.88rem;}
.chatmsg .mname{font-weight:600; color:var(--moss);}
.chatmsg.you .mname{color:var(--ember);}
.chatmsg .mtext{color:var(--ink);}
.copy-btn{
  margin-top:8px;
  font-family:inherit;
  font-size:0.78rem;
  padding:6px 12px;
  border-radius:2px;
  border:1px solid var(--muted);
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}
.copy-btn.copied{border-color:var(--moss); color:var(--moss);}
.alone-hint{
  margin-top:14px;
  padding:14px;
  background:var(--paper-2);
  border-radius:4px;
  font-size:0.88rem;
  color:var(--muted);
  line-height:1.5;
}
  /* --- обновлённый стиль кнопок --- */
.btn, .checkbtn, .notify-btn, .copy-btn, .joingroup button, #chatSendBtn, #authSubmit{
  transition: transform 0.1s ease, box-shadow 0.15s ease, background 0.15s ease;
  box-shadow: 0 1px 2px rgba(32,40,31,0.08);
}
.btn:active, .checkbtn:active, .notify-btn:active, .copy-btn:active, .joingroup button:active, #chatSendBtn:active{
  transform: scale(0.96);
  box-shadow: none;
}
.btn:hover, .checkbtn:hover{ box-shadow: 0 2px 6px rgba(32,40,31,0.14); }

.danger-btn{
  margin-top:14px;
  width:100%;
  font-family:inherit;
  font-size:0.85rem;
  padding:11px 16px;
  border-radius:6px;
  border:1px solid #B75B2E;
  background:transparent;
  color:#B75B2E;
  cursor:pointer;
  transition: all 0.15s ease;
}
.danger-btn:active{ transform:scale(0.97); background:#B75B2E; color:#fff; }

/* --- плавающая кнопка чата --- */
#chatFab{
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(150deg, var(--moss) 0%, var(--moss-dark) 100%);
  color: var(--paper);
  border: none;
  font-size: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 18px rgba(32,40,31,0.35), 0 0 0 4px rgba(69,91,65,0.12);
  z-index: 50;
  cursor: pointer;
  animation: chatFabIn 0.25s ease;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
#chatFab:hover{
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 10px 22px rgba(32,40,31,0.4), 0 0 0 5px rgba(69,91,65,0.16);
}
#chatFab:active{ transform: scale(0.9); }
@keyframes chatFabIn{
  from{ opacity:0; transform: scale(0.6) translateY(10px); }
  to{ opacity:1; transform: scale(1) translateY(0); }
}

/* --- модалка чата --- */
.chat-modal-overlay{
  position: fixed;
  inset: 0;
  background: rgba(32,40,31,0.45);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.chat-modal{
  background: var(--card);
  width: 100%;
  max-width: 520px;
  border-radius: 16px 16px 0 0;
  padding: 0;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 -6px 24px rgba(0,0,0,0.2);
}
.chat-modal-head{
  display:flex; justify-content:space-between; align-items:center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  font-family:'Fraunces', serif;
  font-size: 1.05rem;
}
.chat-modal-head button{
  background:none; border:none; font-size:1.2rem; color:var(--muted); cursor:pointer;
}
.chat-modal .chat-panel{
  margin:0; border-radius:0; background:transparent;
  padding: 16px 20px; overflow-y:auto;
}

/* --- более округлые карточки и мягкий фон --- */
.today-card, .group-card, .authbox, .hero-visual, .chat-panel, .today-card{
  border-radius: 14px;
}
.checkbtn, .btn, #authSubmit{ border-radius: 8px; }
.group-id-chip{
  margin-top:16px;
  padding:10px 12px;
  background:var(--paper-2);
  border-radius:3px;
  font-size:0.8rem;
  color:var(--muted);
  word-break:break-all;
}
.group-id-chip .idval{
  font-family:monospace;
  color:var(--ink);
  display:block;
  margin-top:4px;
}
.notify-btn{
  margin-top:14px;
  width:auto;
  display:inline-block;
  padding:9px 16px;
  font-size:0.85rem;
  border-radius:3px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-family:inherit;
}
.notify-btn:disabled{
  color:var(--moss);
  border-color:var(--moss);
}
.chat-panel{
  margin-top:20px;
  padding:16px;
  background:var(--paper-2);
  border-radius:4px;
}  
  .empty{color:var(--muted); font-size:0.88rem;}

  .hidden{display:none !important;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo"><span class="logo-mark"></span>привычка</div>
    <div id="userBadge"></div>
  </div>
</header>

<main class="wrap">
<p class="greeting" id="greeting" style="display:none;"></p>
  <!-- AUTH -->
  <div id="authView" class="authbox">
    <h2 id="authTitle">Войти</h2>
    <p class="sub" id="authSub">Отметки сохраняются на твоём аккаунте.</p>
    <label for="authEmail">Email</label>
    <input type="email" id="authEmail" autocomplete="email">
    <label for="authPass">Пароль</label>
    <input type="password" id="authPass" autocomplete="current-password">
    <button class="btn" id="authSubmit">Войти</button>
    <div class="authmsg" id="authMsg"></div>
    <div class="switch">
      <span id="switchText">Нет аккаунта?</span>
      <button id="switchBtn">Зарегистрироваться</button>
    </div>
  </div>

  <!-- APP -->
  <div id="appView" class="hidden">
    <div class="setup-row">
      <select id="habitEmoji">
        <option value="🏃">🏃</option><option value="📖">📖</option>
        <option value="🧘">🧘</option><option value="💧">💧</option>
        <option value="✍️">✍️</option><option value="🚭">🚭</option>
      </select>
      <input type="text" id="habitName" maxlength="40" placeholder="название привычки">
    </div>
  <div  class="today-card">
      <div class="row">
        <div><span class="emoji" id="cardEmoji">🏃</span> <span class="name" id="cardName">Привычка</span></div>
        <button class="checkbtn" id="checkBtn">Отметить</button>
      </div>
      <div class="streakrow">
  <div class="stat"><div class="num" id="curStreak">0</div><div class="lab">дней подряд</div></div>
  <div class="stat"><div class="num" id="totalDays">0</div><div class="lab">всего отметок</div></div>
</div>
<div class="week" id="weekRow"></div>

    <div class="group-card">
      <div class="group-head"><h3>Группа</h3><span class="empty" id="groupCount"></span></div>
      <div id="memberList"><p class="empty">Ты пока не в группе.</p></div>
      <div class="joingroup">
  <input type="text" id="groupCodeInput" placeholder="ID группы, чтобы присоединиться">
  <button id="joinBtn">Войти</button>
</div>
<div class="joingroup" style="margin-top:10px;">
  <input type="text" id="newGroupName" placeholder="название новой группы">
  <button id="createGroupBtn">Создать</button>
</div>
<div class="group-id-chip" id="myGroupId" style="display:none;">
  <button class="copy-btn" id="copyGroupIdBtn">Скопировать ссылку-приглашение</button>
</div>
<p class="alone-hint" id="aloneHint" style="display:none;">Пока в группе только ты. Отправь ID друзьям — когда они присоединятся, ты будешь видеть, кто уже отметился сегодня.</p>
      <button class="danger-btn" id="deleteGroupBtn" style="display:none;">Покинуть / удалить группу</button>

<button id="chatFab" style="display:none;">💬</button>
<div id="chatBox" class="chat-modal-overlay" style="display:none;">
  <div class="chat-modal">
    <div class="chat-modal-head">
      <span>Чат группы</span>
      <button id="chatCloseBtn">✕</button>
    </div>
    <div class="chat-panel">
    <button id="notifyBtn" class="notify-btn">Включить уведомления</button>
    <div id="chatMessages" style="max-height:220px; overflow-y:auto; margin-top:14px; margin-bottom:12px;"></div>
    <div class="joingroup">
      <input type="text" id="chatInput" placeholder="написать в группу...">
      <button id="chatSendBtn">Отправить</button>
    </div>
  </div>
  </div>
    </div>
    </div>
    </div>
  </div>

</main>

<script>
// ==========================================================
// !! Вставь свои значения из Supabase → Project Settings → API
// ==========================================================
const SUPABASE_URL = "https://hjgeorrnfuydwyfrjimy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqZ2VvcnJuZnV5ZHd5ZnJqaW15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0Mjc1MTQsImV4cCI6MjEwNTAwMzUxNH0.-RiZ3Z_BfIOsaBp0QbdN3etGNERyKak86KPxfcpsF9w";const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let mode = 'login'; // or 'signup'
let currentUser = null;
let currentHabit = null;
let myGroupId = null;

const el = id => document.getElementById(id);

// ---------- AUTH ----------
el('switchBtn').addEventListener('click', ()=>{
  mode = mode === 'login' ? 'signup' : 'login';
  el('authTitle').textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';
  el('authSubmit').textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
  el('switchText').textContent = mode === 'login' ? 'Нет аккаунта?' : 'Уже есть аккаунт?';
  el('switchBtn').textContent = mode === 'login' ? 'Зарегистрироваться' : 'Войти';
  el('authMsg').textContent = '';
});


el('authSubmit').addEventListener('click', async ()=>{
  const email = el('authEmail').value.trim();
  const password = el('authPass').value;
  const msg = el('authMsg');
  msg.className = 'authmsg';
  if(!email || !password){ msg.textContent = 'Заполни оба поля.'; msg.classList.add('err'); return; }

  try{
    let result;
    if(mode === 'signup'){
      result = await sb.auth.signUp({ email, password });
    } else {
      result = await sb.auth.signInWithPassword({ email, password });
    }
    if(result.error){
      msg.textContent = result.error.message;
      msg.classList.add('err');
      return;
    }
    if(mode === 'signup' && !result.data.session){
      msg.textContent = 'Проверь почту — нужно подтвердить регистрацию.';
      msg.classList.add('ok');
      return;
    }
    await onLoggedIn(result.data.user);
  } catch(e){
    msg.textContent = 'Не удалось связаться с сервером: ' + e.message;
    msg.classList.add('err');
  }
});

async function onLoggedIn(user){
  currentUser = user;
  el('authView').classList.add('hidden');
  el('appView').classList.remove('hidden');
  el('userBadge').innerHTML = user.email + ' <button id="logoutBtn">выйти</button>';
  el('greeting').textContent = 'Привет, ' + user.email.split('@')[0] + '!';
el('greeting').style.display = 'block';
  el('logoutBtn').addEventListener('click', async ()=>{
    await sb.auth.signOut();
    location.reload();
  });
  await loadHabit();
  await loadGroup();
}

// ---------- HABIT ----------
async function loadHabit(){
  const { data } = await sb.from('habits').select('*').eq('user_id', currentUser.id).limit(1).maybeSingle();
  if(data){
    currentHabit = data;
    el('habitEmoji').value = data.emoji;
    el('habitName').value = data.name;
  }
  renderHabitCard();
  await refreshStats();
}

async function saveHabitMeta(){
  const emoji = el('habitEmoji').value;
  const name = el('habitName').value.trim() || 'Привычка';
  if(currentHabit){
    await sb.from('habits').update({ emoji, name }).eq('id', currentHabit.id);
    currentHabit.emoji = emoji; currentHabit.name = name;
  } else {
    const { data } = await sb.from('habits').insert({ user_id: currentUser.id, emoji, name }).select().single();
    currentHabit = data;
  }
  renderHabitCard();
}
el('habitEmoji').addEventListener('change', saveHabitMeta);
el('habitName').addEventListener('change', saveHabitMeta);

function renderHabitCard(){
  el('cardEmoji').textContent = currentHabit ? currentHabit.emoji : el('habitEmoji').value;
  el('cardName').textContent = currentHabit ? currentHabit.name : 'Привычка';
}

async function refreshStats(){
  if(!currentHabit) return;
  const { data: checkins } = await sb.from('checkins').select('checkin_date').eq('habit_id', currentHabit.id).order('checkin_date', {ascending:false});
  const dates = new Set((checkins||[]).map(c=>c.checkin_date));
  el('totalDays').textContent = dates.size;

  const today = new Date().toISOString().slice(0,10);
  const checkedToday = dates.has(today);
  el('checkBtn').textContent = checkedToday ? 'Отмечено' : 'Отметить';
  el('checkBtn').classList.toggle('done', checkedToday);

  let streak = 0;
  let cursor = new Date();
  if(!checkedToday) cursor.setDate(cursor.getDate()-1);
  while(dates.has(cursor.toISOString().slice(0,10))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  function renderWeekRow(dates){
  const weekRow = el('weekRow');
  weekRow.innerHTML = '';
  const labels = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    const dayLabel = labels[(d.getDay()+6)%7];
    const wd = document.createElement('div');
    wd.className = 'wd';
    wd.innerHTML = '<div class="lbl">'+dayLabel+'</div><div class="box'+(dates.has(ds)?' on':'')+(i===0?' today':'')+'"></div>';
    weekRow.appendChild(wd);
  }
  }
  el('curStreak').textContent = streak;
}
  

el('checkBtn').addEventListener('click', async ()=>{
  try{
    if(!currentHabit) await saveHabitMeta();
    const today = new Date().toISOString().slice(0,10);
    const isDone = el('checkBtn').classList.contains('done');
    let result;
    if(isDone){
      result = await sb.from('checkins').delete().eq('habit_id', currentHabit.id).eq('checkin_date', today);
    } else {
      result = await sb.from('checkins').insert({ habit_id: currentHabit.id, user_id: currentUser.id, checkin_date: today });
    }
    if(result.error) alert('Ошибка: ' + result.error.message);
    await refreshStats();
  } catch(e){
    alert('Не удалось связаться с сервером: ' + e.message);
  }
});

// ---------- GROUP ----------
function showGroupIdChip(){
  el('myGroupId').innerHTML = 'ID твоей группы<span class="idval">' + myGroupId + '</span><button class="copy-btn" id="copyGroupIdBtn">Скопировать ссылку-приглашение</button>';
  el('myGroupId').style.display = 'block';
  attachCopyBtn();
}
function attachCopyBtn(){
  const btn = document.getElementById('copyGroupIdBtn');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    navigator.clipboard.writeText(myGroupId).then(()=>{
      btn.textContent = 'Скопировано!';
      btn.classList.add('copied');
      setTimeout(()=>{ btn.textContent = 'Скопировать ссылку-приглашение'; btn.classList.remove('copied'); }, 2000);
    });
  });
}
async function loadGroup(){
  const { data: membership } = await sb.from('group_members').select('group_id').eq('user_id', currentUser.id).maybeSingle();
  if(!membership){ return; }
  myGroupId = membership.group_id;
  showGroupIdChip();
  await renderGroupMembers();
  el('chatFab').style.display = 'flex';
  el('deleteGroupBtn').style.display = 'block';
  await loadChatMessages();
  subscribeToChat();
}
el('joinBtn').addEventListener('click', async ()=>{
  const code = el('groupCodeInput').value.trim();
  if(!code) return;
  try{
    const displayName = currentUser.email.split('@')[0];
    const { error } = await sb.from('group_members').insert({ group_id: code, user_id: currentUser.id, display_name: displayName });
    if(error){ alert('Ошибка: ' + error.message); return; }
    myGroupId = code;
    showGroupIdChip();
    await renderGroupMembers();
    el('chatFab').style.display = 'flex';
    el('deleteGroupBtn').style.display = 'block';
    await loadChatMessages();
    subscribeToChat();
  } catch(e){
    alert('Не удалось связаться с сервером: ' + e.message);
  }
});
el('createGroupBtn').addEventListener('click', async ()=>{
  const name = el('newGroupName').value.trim();
  if(!name) return;
  try{
    const { data: group, error: groupError } = await sb.from('groups')
      .insert({ name, created_by: currentUser.id })
      .select()
      .single();
    if(groupError){ alert('Ошибка: ' + groupError.message); return; }

    const displayName = currentUser.email.split('@')[0];
    const { error: memberError } = await sb.from('group_members')
      .insert({ group_id: group.id, user_id: currentUser.id, display_name: displayName });
    if(memberError){ alert('Ошибка: ' + memberError.message); return; }

    myGroupId = group.id;
    el('newGroupName').value = '';
    showGroupIdChip();
    await renderGroupMembers();
    el('chatFab').style.display = 'flex';
    el('deleteGroupBtn').style.display = 'block';
    await loadChatMessages();
    subscribeToChat();
  } catch(e){
    alert('Не удалось связаться с сервером: ' + e.message);
  }
});
  let chatChannel = null;

el('notifyBtn').addEventListener('click', async ()=>{
  if(!('Notification' in window)){ alert('Браузер не поддерживает уведомления'); return; }
  const perm = await Notification.requestPermission();
  if(perm === 'granted'){
    el('notifyBtn').textContent = 'Уведомления включены';
    el('notifyBtn').disabled = true;
  } else {
    alert('Уведомления не разрешены в настройках браузера');
  }
});

async function loadChatMessages(){
  const { data } = await sb.from('group_messages').select('*').eq('group_id', myGroupId).order('created_at', {ascending:true}).limit(50);
  const box = el('chatMessages');
  box.innerHTML = '';
  (data||[]).forEach(m=>{
    const div = document.createElement('div');
    div.className = 'chatmsg' + (m.user_id===currentUser.id ? ' you' : '');
    div.innerHTML = '<span class="mname">'+m.display_name+':</span> <span class="mtext"></span>';
    div.querySelector('.mtext').textContent = m.content;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function subscribeToChat(){
  if(chatChannel) sb.removeChannel(chatChannel);
  chatChannel = sb.channel('chat-'+myGroupId)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'group_messages', filter:'group_id=eq.'+myGroupId }, payload=>{
      const m = payload.new;
      if(m.user_id !== currentUser.id && Notification.permission === 'granted' && document.hidden){
        new Notification(m.display_name, { body: m.content });
      }
      const box = el('chatMessages');
      const div = document.createElement('div');
      div.className = 'chatmsg' + (m.user_id===currentUser.id ? ' you' : '');
      div.innerHTML = '<span class="mname">'+m.display_name+':</span> <span class="mtext"></span>';
      div.querySelector('.mtext').textContent = m.content;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    })
    .subscribe();
}

el('chatSendBtn').addEventListener('click', async ()=>{
  const text = el('chatInput').value.trim();
  if(!text || !myGroupId) return;
  const displayName = currentUser.email.split('@')[0];
  el('chatInput').value = '';
  await sb.from('group_messages').insert({ group_id: myGroupId, user_id: currentUser.id, display_name: displayName, content: text });
});
  async function renderGroupMembers(){
  if(!myGroupId) return;
  const { data: members } = await sb.from('group_members').select('user_id, display_name').eq('group_id', myGroupId);
  const list = el('memberList');
  list.innerHTML = '';
  el('groupCount').textContent = (members||[]).length + ' человек';
el('aloneHint').style.display = (members||[]).length <= 1 ? 'block' : 'none';

  const today = new Date().toISOString().slice(0,10);
  for(const m of (members||[])){
    const { data: theirCheckin } = await sb.from('checkins').select('id').eq('user_id', m.user_id).eq('checkin_date', today).maybeSingle();
    const row = document.createElement('div');
    row.className = 'member' + (m.user_id === currentUser.id ? ' you' : '');
    row.innerHTML =
      '<div class="avatar">'+m.display_name.slice(0,1).toUpperCase()+'</div>'+
      '<div class="member-info"><div class="mname">'+m.display_name+'</div></div>'+
      '<div class="member-status'+(theirCheckin?' done':'')+'"></div>';
    list.appendChild(row);
  }
}
el('chatFab').addEventListener('click', ()=>{ el('chatBox').style.display = 'flex'; });
el('chatCloseBtn').addEventListener('click', ()=>{ el('chatBox').style.display = 'none'; });

el('deleteGroupBtn').addEventListener('click', async ()=>{
  if(!confirm('Покинуть группу? Если ты её создатель, группа удалится для всех.')) return;
  await sb.from('group_members').delete().eq('group_id', myGroupId).eq('user_id', currentUser.id);
  await sb.from('groups').delete().eq('id', myGroupId).eq('created_by', currentUser.id);
  location.reload();
});
// ---------- restore session on load ----------
(async ()=>{
  const { data } = await sb.auth.getSession();
  if(data.session){
    await onLoggedIn(data.session.user);
  }
})();
</script>
